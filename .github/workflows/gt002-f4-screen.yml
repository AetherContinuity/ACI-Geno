# ==========================================================================
# GT-002.2 — f4/D Screen GitHub Actions Workflow
# ==========================================================================
# Copy this file to:  .github/workflows/gt002-f4-screen.yml
#
# What it does:
#   1. Checks out repo (includes .anno, build_cohort.py, prep_gt002_2.py)
#   2. Runs prep_gt002_2.py (fast ~1 min) → creates gt002/popinv/*.tsv
#   3. Installs R + ADMIXTOOLS2 from GitHub (~15 min compile)
#   4. Downloads AADR v66.p1 genotype files from Harvard Dataverse (~10 min)
#   5. Runs run_f4_screen.R (~45 min) → creates gt002/f4_results/*.tsv
#   6. Commits popinv/ and f4_results/ back to repo
#
# Triggers:
#   - Manual (workflow_dispatch)
#   - Push to gt002/prep_gt002_2.py, gt002/run_f4_screen.R, or this workflow
#
# Disk budget (ubuntu-latest: ~14 GB available):
#   checkout:     ~25 MB
#   .geno:        7.1 GB (downloaded, then renamed, then deleted after f2)
#   .snp:         78 MB
#   .ind:         1 MB
#   f2 blocks:    ~1-2 GB (depends on number of populations)
#   R packages:   ~2 GB (system library)
#   Peak:         ~10-11 GB (after .geno is deleted, drops to ~4 GB)
# ==========================================================================

name: GT-002.2 f4 Screen

on:
  push:
    paths:
      - 'gt002/prep_gt002_2.py'
      - 'gt002/run_f4_screen.R'
      - '.github/workflows/gt002-f4-screen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  f4-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ================================================================
      # STEP 1: Checkout repository (includes .anno + scripts)
      # ================================================================
      - uses: actions/checkout@v4

      - name: Check disk space (initial)
        run: df -h /

      # ================================================================
      # STEP 2: Run population inventory (Python, fast ~1 min)
      # ================================================================
      - name: Run prep_gt002_2.py
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 gt002/prep_gt002_2.py

      - name: Show prep summary
        run: |
          echo "=== Population labels ==="
          cat gt002/popinv/GT-002.2.pop_labels.tsv || echo "NOT FOUND"
          echo ""
          echo "=== f4 test count ==="
          wc -l gt002/popinv/GT-002.2.f4_tests.tsv || echo "NOT FOUND"

      # Commit prep output NOW so it survives even if f4 screen fails later
      - name: Commit prep results
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gt002/popinv/
          if git diff --cached --quiet; then
            echo "No prep changes to commit"
          else
            git commit -m "GT-002.2: population inventory [skip ci]"
            git push
          fi

      # ================================================================
      # STEP 3: Install R + system dependencies for ADMIXTOOLS2
      # ================================================================
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            libgsl-dev \
            libxml2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libglpk-dev \
            libgmp-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev

      - name: Install R packages (data.table, remotes)
        run: |
          install.packages(c("data.table", "remotes"))
        shell: Rscript {0}

      - name: Install ADMIXTOOLS2 from GitHub
        run: |
          # dependencies = TRUE installs all Imports from CRAN
          # upgrade = "never" avoids upgrading already-installed packages
          # This compiles C++ (Rcpp, RcppArmadillo, pgenlibr, igraph) — ~15 min
          remotes::install_github("uqrmaie1/admixtools", dependencies = TRUE, upgrade = "never")
        shell: Rscript {0}

      - name: Verify ADMIXTOOLS2 installation
        run: |
          library(admixtools)
          cat("ADMIXTOOLS2 loaded successfully\n")
          packageVersion("admixtools")
        shell: Rscript {0}

      # ================================================================
      # STEP 4: Download AADR v66.p1 genotype files from Dataverse
      # ================================================================
      - name: Download genotype files
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "Downloading .ind (1 MB)..."
          wget -q -O v66.p1_1240K.aadr.patch.PUB.ind \
            "https://dataverse.harvard.edu/api/access/datafile/13994513"

          echo "Downloading .snp (78 MB)..."
          wget -q -O v66.p1_1240K.aadr.patch.PUB.snp \
            "https://dataverse.harvard.edu/api/access/datafile/13994514"

          echo "Downloading .geno (7.1 GB)..."
          wget -q -O v66.p1_1240K.aadr.patch.PUB.geno \
            "https://dataverse.harvard.edu/api/access/datafile/13994829"

          echo "Download complete. File sizes:"
          ls -lh v66.p1_1240K.aadr.patch.PUB.{geno,ind,snp}

      - name: Check disk space (after download)
        run: df -h /

      # ================================================================
      # STEP 5: Run f4 screen
      # ================================================================
      - name: Run f4 screen
        run: |
          cd "$GITHUB_WORKSPACE"
          Rscript gt002/run_f4_screen.R

      - name: Check disk space (after f4)
        run: df -h /

      # ================================================================
      # STEP 6: Commit results back to repo
      # ================================================================
      - name: Commit results
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add f4_results (popinv already committed earlier)
          git add gt002/f4_results/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "GT-002.2: f4 screen results [skip ci]"
            git push
          fi

      # ================================================================
      # STEP 7: Upload artifacts (backup, in case commit fails)
      # ================================================================
      - uses: actions/upload-artifact@v4
        with:
          name: gt002-f4-results
          path: |
            gt002/popinv/*.tsv
            gt002/f4_results/*.tsv
          retention-days: 30
